# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Run Gradle in parallel mode.
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture disabled: keeps compatibility with realm, react-native-sound,
# react-native-splash-screen and other classic-bridge native modules.
newArchEnabled=false

# Hermes JS engine.
hermesEnabled=true

# Edge-to-edge display support (enforced behavior on Android 15+ / targetSdk 35+).
edgeToEdgeEnabled=true

# Upload keystore signing config
MYAPP_UPLOAD_STORE_FILE=my-upload-key.keystore
MYAPP_UPLOAD_KEY_ALIAS=mactung
MYAPP_UPLOAD_STORE_PASSWORD=mactung
MYAPP_UPLOAD_KEY_PASSWORD=mactung
