# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Run Gradle in parallel mode.
org.gradle.parallel=true

# AndroidX package structure
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# New Architecture disabled: safest for classic native modules (react-native-sound,
# blur). Realm (which required TurboModules) has been removed.
newArchEnabled=false

# Hermes JS engine.
hermesEnabled=true

# Edge-to-edge display support (enforced behavior on Android 15+ / targetSdk 35+).
edgeToEdgeEnabled=true

# Release signing is configured in android/keystore.properties (see app/build.gradle).
